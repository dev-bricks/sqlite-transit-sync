[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-transit-sync"
version = "0.3.0"
description = "Local-first SQLite synchronization through verified snapshots and configurable row-level merge policies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Lukas Geiger / ellmos / BACH Contributors"}]
keywords = ["sqlite", "synchronization", "local-first", "offline-first", "snapshot", "database", "last-write-wins", "sync-master", "data-integrity"]
dependencies = []

[project.urls]
Homepage = "https://github.com/dev-bricks/sqlite-transit-sync#readme"
Repository = "https://github.com/dev-bricks/sqlite-transit-sync"
Issues = "https://github.com/dev-bricks/sqlite-transit-sync/issues"
Documentation = "https://github.com/dev-bricks/sqlite-transit-sync/blob/main/README.md"

[project.optional-dependencies]
dev = ["pytest>=7", "cryptography>=42"]
# The core stays dependency free on purpose: push/pull needs nothing but the standard
# library. Only publish-replica mode encrypts, so its cipher is opt-in.
crypto = ["cryptography>=42"]

[project.scripts]
sqlite-transit-sync = "sqlite_transit_sync.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sqlite_transit_sync*"]

[tool.setuptools.package-data]
# The credential triggers ship with the package: without this the scan would
# raise on a pip-installed copy because the JSON never reaches the wheel.
sqlite_transit_sync = ["credential-triggers.json"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = "."
